<!doctype html><html data-screen="map" lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>کارا · هواشناسی · نقشه</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="typography.css"><link rel="stylesheet" href="map.css"><link rel="stylesheet" href="forest-theme.css"><link rel="stylesheet" href="motion.css"><script src="motion.js"></script></head><body>
<div id="shell"><header><button id="back" aria-label="بازگشت">➜</button><div><h1>اطلس هوا</h1><small id="provider">پیش‌بینی مکانی ECMWF IFS · ۹ کیلومتر</small></div><button id="favoritesButton" aria-label="علاقه‌مندی‌ها">★</button></header>
<nav id="layers" aria-label="لایه‌های هواشناسی"><button data-layer="temperature_2m" class="selected">دما</button><button data-layer="precipitation">بارش</button><button data-layer="accum">تجمع ۶ساعته</button><button data-layer="cloud_cover">ابر</button><button data-layer="rain">باران</button><button data-layer="snowfall">برف</button><button data-layer="radar">رادار</button></nav>
<section id="mapArea"><div id="map"></div><div id="mapStatus" role="status">در حال آماده‌سازی نقشه…</div><div id="tools"><button id="homeLocation" aria-label="مکان فعلی انتخاب‌شده"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button><button id="mapRefresh" aria-label="تازه‌سازی لایه"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg></button><button id="opacityButton" aria-label="شفافیت لایه"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path fill="currentColor" d="M12 4a8 8 0 0 1 0 16z"/></svg></button></div><div id="legend"><div id="legendTitle">دما · °C</div><div id="legendGradient"></div><div id="legendLabels"></div></div><div id="pointCard" hidden><button id="pointClose" aria-label="بستن نقطه">✕</button><strong id="pointName">نقطهٔ انتخابی</strong><div id="pointCoords"></div><div id="pointValue"></div><div class="pointActions"><button id="savePoint">☆ ذخیرهٔ مکان</button><button id="forecastPoint">پیش‌بینی اینجا</button></div></div></section>
<section id="timeline"><div class="timehead"><button id="play" aria-label="پخش زمان">▶</button><div><strong id="frameTime">—</strong><small id="timeHint">پیش‌بینی · زمان محلی مکان انتخابی</small></div><button id="nextTime" aria-label="ساعت بعد">‹</button></div><input id="timeSlider" type="range" min="0" max="0" value="0" step="1" aria-label="انتخاب زمان نقشه"><div id="timeChips" role="group" aria-label="ساعت‌های نقشه"></div><p id="mapNote">روی نقشه لمس کن تا مکان دلخواه را ذخیره کنی.</p></section></div>
<dialog id="favoritesDialog"><div class="modalHead"><h2>مکان‌های دلخواه</h2><button id="favoritesClose">✕</button></div><p>یک مکان را انتخاب کن یا روی نقشه نقطهٔ تازه‌ای لمس کن.</p><div id="savedPlaces"></div></dialog>
<dialog id="nameDialog"><h2>ذخیرهٔ مکان</h2><form id="nameForm"><label for="pointLabel">نام دلخواه</label><input id="pointLabel" maxlength="60" required placeholder="مثلاً خانه، محل کار، محل کمپ"><div class="pointActions"><button type="submit">ذخیره</button><button type="button" id="nameCancel">انصراف</button></div></form></dialog>
<script src="vendor/leaflet.js"></script><script type="module" src="map.js"></script><script src="alerts.js"></script></body></html>
