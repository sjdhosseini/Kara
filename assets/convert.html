<!doctype html><html data-screen="convert" lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تبدیل</title><link rel="stylesheet" href="forest-theme.css"><style>
@font-face{font-family:v;src:url(fonts/Vazirmatn.ttf)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:linear-gradient(#092a23cc,#09241fed 40%),url(forest.jpg) center/cover;color:#effaf4;font:16px v,sans-serif}main{max-width:560px;margin:auto;padding:20px}header,nav,.pair{display:flex;align-items:center;gap:9px}header{justify-content:space-between}h1{font-size:25px}a{color:#c5eedb}button,input,select{font:inherit;color:inherit;border-radius:13px;border:1px solid #759a836e;background:#193c32;padding:10px;min-height:46px}button{cursor:pointer}nav button{flex:1}button[aria-pressed=true],.action{background:#a0e2bd;color:#102d22;font-weight:700}section{margin-top:16px;background:#102d27f2;border:1px solid #63928168;border-radius:22px;padding:18px}label{display:block;margin:10px 0}input,select,.action{display:block;width:100%;margin-top:4px}.pair label{flex:1;min-width:0}.result{color:#bef5d4;font-size:24px;overflow-wrap:anywhere}.note{font-size:13px;color:#bed5c8}option{color:white;background:#183c31}
</style><link rel="stylesheet" href="motion.css"><script src="motion.js"></script><link rel="stylesheet" href="clean-theme.css"><main><header><h1>تبدیل</h1><a href="home.html">بازگشت به خانه</a></header><nav><button data-tab="files">فایل</button><button data-tab="money">ارز</button><button data-tab="units">واحدها</button></nav>
<section id="files"><button class="action" onclick="Native.openMediaTools()">استخراج صدا و ویدیوی بی‌صدا · کپشن</button><button class="action" onclick="Native.scan('')">اسکن سند و ساخت PDF چندصفحه‌ای</button><label>نوع تبدیل<select id="format"><option value="jpg">عکس به JPG</option><option value="png">عکس به PNG</option><option value="webp">عکس به WebP</option><option value="pdf">عکس به PDF</option><option value="pdfpng">صفحهٔ اول PDF به PNG</option><option value="zip">فشرده‌سازی یک فایل در ZIP</option></select></label><p class="note">تبدیل روی گوشی انجام می‌شود. عکس‌های بزرگ‌تر از ۱۲ مگاپیکسل برای مصرف کمتر حافظه کوچک می‌شوند.</p><button class="action" id="pick">انتخاب فایل و تبدیل</button></section>
<section id="money" hidden><div class="pair"><label>از<select id="source"></select></label><button id="swap" aria-label="جابه‌جایی ارزها">⇄</button><label>به<select id="target"></select></label></div><label>مبلغ<input id="amount" inputmode="decimal" value="۱"></label><div id="marketBox"><label>منبع بازار ایران<select id="marketSource"><option value="auto">خودکار · اولویت با الان چند؟</option><option value="alan">الان چند؟</option><option value="tg">شبکهٔ طلا و ارز · دلار</option><option value="bon">آرشیو بن‌بست</option></select></label><div class="note" id="quotes"></div></div><label id="manualBox"><span id="rateLabel"></span><input id="manual" inputmode="decimal" placeholder="نرخ دلخواه"></label><p class="result" id="moneyResult" aria-live="polite"></p><p class="note" id="rateNote"></p><button id="update">دریافت نرخ مرجع</button></section>
<section id="units" hidden><label>گروه واحدها<select id="group"></select></label><div class="pair"><label>از<select id="unitFrom"></select></label><button id="unitSwap" aria-label="جابه‌جایی واحدها">⇄</button><label>به<select id="unitTo"></select></label></div><label>مقدار<input id="quantity" inputmode="text" value="۱"></label><p class="result" id="unitResult" aria-live="polite"></p></section></main><script src="market.js"></script><script src="convert.js"></script></html>
