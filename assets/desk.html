<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><link rel="stylesheet" href="branding.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر روزانه</title><link rel="stylesheet" href="forest-theme.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="desk.css"><script src="motion.js"></script>
<link rel="stylesheet" href="clean-theme.css"><main><header><a href="home.html">‹ خانه</a><span class="kart-brand" dir="rtl"><img src="kart-logo.png" alt="" width="36" height="36"><span>کارا</span></span></header><h1>دفتر روزانه</h1><nav><button data-tab="trip">خرج سفر</button><button data-tab="car">خودرو</button><button data-tab="bills">پرداخت‌ها</button></nav>
<section id="trip"><div class="hero-card"><small>دفتر سفر</small><select id="tripList" aria-label="انتخاب سفر"></select><div id="tripTotal"></div><button data-open="newTrip">＋ سفر جدید</button></div><div id="tripBody"><div class="bar"><h2>هزینه‌ها</h2><button data-open="expense">＋ ثبت هزینه</button></div><div id="expenses"></div><div class="bar"><h2>تسویهٔ حساب</h2><button id="share">ارسال خلاصه</button></div><div id="settle"></div></div></section>

</main><dialog id="editor"><form id="form"><div class="bar"><h2 id="editorTitle"></h2><button type="button" id="close">بستن</button></div><div id="fields"></div><p id="err" role="alert"></p><button class="primary">ذخیره</button></form></dialog><script src="desk.js"></script></html>
